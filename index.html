
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mayad AI Bot</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:28px 15px;background:linear-gradient(120deg,#5637df,#087edb)}
header h1{margin:0 0 8px}
main{max-width:600px;margin:auto;padding:16px}
.card{background:#171f34;border-radius:16px;padding:18px;margin:15px 0}
textarea{width:100%;height:100px;background:#0b1020;color:white;border:1px solid #3b4966;border-radius:10px;padding:12px;font-size:16px}
button,.link{display:block;width:100%;padding:13px;margin-top:12px;background:#6457f5;color:white;border:0;border-radius:10px;text-align:center;text-decoration:none;font-size:16px;cursor:pointer}
.green{background:#079b7e}
small,p{line-height:1.6;color:#d3dcf0}
</style>
</head>
<body>
<header>
<h1>🤖 Mayad AI</h1>
<p>Chat with AI • Create AI Photos</p>
</header>
<main>
<section class="card">
<h2>💬 AI Chat</h2>
<textarea id="question" placeholder="তোমার প্রশ্ন লিখো..."></textarea>
<button onclick="sendAI('chat')">AI-কে প্রশ্ন করো</button>
<p id="answer"></p>
</section>

<section class="card">
<h2>🎨 AI Photo Generator</h2>
<textarea id="prompt" placeholder="কেমন ছবি তৈরি করতে চাও?"></textarea>
<button class="green" onclick="sendAI('image')">ছবি তৈরি করো</button>
<p id="photoStatus"></p>
<img id="photo" alt="AI Photo" hidden style="width:100%;border-radius:12px">
</section>

<section class="card">
<h2>✈️ Telegram Bot</h2>
<a class="link" href="https://t.me/YOUR_BOT_USERNAME">
Open Telegram Bot
</a>
</section>
</main>
<script>
const API_URL = "";
async function sendAI(mode){
 const prompt=document.getElementById(mode==="chat"?"question":"prompt").value.trim();
 const out=document.getElementById(mode==="chat"?"answer":"photoStatus");
 if(!prompt){out.textContent="আগে কিছু লিখো।";return}
 if(!API_URL){out.textContent="Netlify Function API URL এখনো সংযুক্ত করা হয়নি।";return}
 out.textContent="অপেক্ষা করো...";
 try{
  const r=await fetch(API_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({mode,prompt})
  });
  if(!r.ok)throw Error("API error");
  const d=await r.json();
  if(mode==="chat")out.textContent=d.answer||"উত্তর পাওয়া যায়নি";
  else if(d.imageUrl){
   const img=document.getElementById("photo");
   img.src=d.imageUrl;img.hidden=false;out.textContent="ছবি তৈরি হয়েছে";
  }else out.textContent="ছবি তৈরি হয়নি";
 }catch(e){out.textContent="সংযোগ সমস্যা। API সেটিংস পরীক্ষা করো।"}
}
</script>
</body>
</html>
